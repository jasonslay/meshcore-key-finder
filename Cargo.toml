[package]
name = "meshcore-key-finder"
version = "0.1.0"
edition = "2021"
description = "Generate MeshCore Ed25519 keys with a chosen public key hex prefix"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hex = "0.4"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libsodium-sys = "0.2.7"
ed25519-dalek = { version = "2.2.0", features = ["digest"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
rand = "0.8"

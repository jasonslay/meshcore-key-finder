[package]
name = "meshcore-key-finder"
version = "0.1.1"
edition = "2021"
description = "Generate MeshCore Ed25519 keys with a chosen public key hex prefix"
authors = ["Jason Slay <jason@jtslay.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jasonslay/meshcore-key-finder"
homepage = "https://github.com/jasonslay/meshcore-key-finder"
keywords = ["meshcore", "ed25519", "cryptography", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hex = "0.4"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
curve25519-dalek = { version = "4.1.3", features = ["precomputed-tables"] }
ed25519-dalek = { version = "2.2.0", features = ["digest"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rand = "0.8"

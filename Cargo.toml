[package]
name = "meshcore-key-finder"
version = "0.1.0"
edition = "2021"
description = "Generate MeshCore Ed25519 keys with a chosen public key hex prefix"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
rand = "0.8"
